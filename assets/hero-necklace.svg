<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Colorful Hazy Daisy necklace</title>
  <desc id="heroDesc">A coral, turquoise, pearl, black, and gold beaded necklace with a daisy pendant on an abstract sunset background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a895"/>
      <stop offset=".52" stop-color="#f5d47f"/>
      <stop offset="1" stop-color="#83cfc3"/>
    </linearGradient>
    <radialGradient id="pearl" cx=".32" cy=".25" r=".75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#fff8eb"/>
      <stop offset="1" stop-color="#c8aa9c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a5"/>
      <stop offset=".45" stop-color="#d7a83f"/>
      <stop offset="1" stop-color="#9b6b1e"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#4a2930" flood-opacity=".2"/>
    </filter>
    <filter id="hardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#28232d" flood-opacity=".95"/>
    </filter>
  </defs>

